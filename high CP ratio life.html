<style>
:root{--bg:#eadfca;--card:#fffaf0;--ink:#3a2f25;--sub:#7a6a58;--line:#cdb995;--accent:#b8456a;--accent-bg:#f8e1e8;--on:#fff;--a:#2f6b57;--abg:#dcebe2;--b:#9a6410;--bbg:#f6e6bd;--c:#a2442a;--cbg:#f6dccf;--r:10px;--rc:999px;--rb:6px;--w:740px;--font:"Noto Serif TC","Source Han Serif TC","思源宋體","Songti TC","STSong","PMingLiU","serif"}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--w);margin:0 auto;padding:32px 18px 90px}
.eyebrow{font-size:13px;color:var(--sub);letter-spacing:.12em}
h1{font-size:clamp(28px,6.4vw,44px);line-height:1.3;margin:10px 0 14px;font-weight:900}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--sub);margin:0 0 22px}
.search{display:flex;gap:8px;margin:18px 0 10px}
.search input{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink)}
.search button,.chip,.sit,.more-btn{font:inherit;cursor:pointer}
.btn{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{padding:5px 13px;border-radius:var(--rc);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.more-btn{font-size:14px;background:none;border:none;color:var(--accent);padding:0;margin:0 0 14px}
.more{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin:0 0 16px}
.more[hidden]{display:none}
.more h4{margin:12px 0 6px;font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.08em}
.more h4:first-child{margin-top:0}
.more .chips{margin:0 0 4px}
.more .chip{font-size:13px;padding:3px 10px}
h2{font-size:15px;color:var(--sub);margin:26px 0 10px;font-weight:700;letter-spacing:.1em}
.sits{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sit{text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.sit.on{border-color:var(--accent);background:var(--accent-bg)}
.sit b{display:block;font-size:16px}
.sit span{font-size:13px;color:var(--sub)}
.count{font-size:13px;color:var(--sub);margin:20px 0 8px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.entry h3{margin:0 0 8px;font-size:19px;line-height:1.45;font-weight:700}
.row{display:grid;grid-template-columns:76px 1fr;gap:8px;margin:6px 0;font-size:15px}
.row .k{color:var(--sub);font-size:13px;padding-top:3px;letter-spacing:.06em}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:var(--rb);padding:1px 7px;margin-right:6px;font-family:var(--font)}
.g-A{background:var(--abg);color:var(--a)}
.g-B{background:var(--bbg);color:var(--b)}
.g-C{background:var(--cbg);color:var(--c)}
.ev{margin:3px 0;font-size:14px}
.ev a{color:var(--accent);word-break:break-all}
.warn{margin-top:8px;padding:9px 12px;border-radius:var(--rb);background:var(--cbg);color:var(--ink);font-size:14px}
.legend{font-size:13px;color:var(--sub);border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
.legend p{margin:4px 0}
.tags{margin-top:8px;font-size:12px;color:var(--sub)}
.empty{padding:30px 0;text-align:center;color:var(--sub)}

body{background:var(--bg) radial-gradient(circle at 20px 20px,#d9c9a8 1.2px,transparent 1.5px) 0 0/28px 28px}
.eyebrow{display:inline-block;background:#f6e6bd;border:1px dashed #b99a5a;padding:2px 10px;transform:rotate(-1.2deg)}
h1{font-weight:700}
.entry,.sit,.more{border:1.5px dashed var(--line);box-shadow:3px 4px 0 #d8c7a3}
.sit.on{box-shadow:3px 4px 0 var(--accent);}
.entry h3::before{content:"✎ ";color:var(--accent)}
.chip{border-style:dashed}
.warn{border:1px dashed #c98f7a}

</style>
</head>

<div class="wrap">
  <div class="eyebrow"><span id="n">0</span> 條 · 每條都寫明來源與可靠度</div>
  <h1>用最少的<em>錢</em>、時間和精力，<br>換回最穩的<em>收入</em>與選擇權。</h1>
  <p class="lead">給家境一般、輸不起、想把每一分錢花在刀口上的台灣學生。每一條都寫：花掉什麼、換回什麼、資料可不可靠。</p>

  <div class="search">
    <input id="q" type="search" placeholder="搜一件事：學貸、機師、台積電、國營…" autocomplete="off">
    <button class="btn" id="rand">隨機抽一條</button>
  </div>
  <div class="chips" id="chips"></div>
  <button class="more-btn" id="moreBtn" aria-expanded="false">更多關鍵字 ▾</button>
  <div class="more" id="more" hidden></div>

  <h2>你現在的處境</h2>
  <div class="sits" id="sits"></div>

  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="legend">
    <p><b>可靠度 A／B／C 是什麼意思</b></p>
    <p><span class="badge g-A">A</span>直接取得官方原始文件或公告（例如學校公布的收費表）。</p>
    <p><span class="badge g-B">B</span>新聞或整理網站轉述官方數據，或只取得搜尋摘要，建議回原始出處核對。</p>
    <p><span class="badge g-C">C</span>機構自述、估計，或作者的判斷與經驗，沒有統計來源。</p>
    <p>本頁的數字整理日期：2026-10-17。薪資多為「平均」，不是起薪；金額以各單位最新公告為準。作者的排序與建議為個人判斷。</p>
  </div>
</div>

const $ = s => document.querySelector(s);
let sit = null, tag = null, q = "";

const allTags = [...new Set(E.flatMap(e => e.tags))];
$("#n").textContent = E.length;
/* 外面只放最重要的 10 個關鍵字；其餘依類別收進「更多關鍵字」 */
const HOT = ["學貸","最低工資","欠薪","失業給付","押金","租金補貼","健保","詐騙","獎學金","實習"];
const GROUPS = {
  "升學與學費":["學費","學雜費","雜費","學雜費表","公立","國立","私立","差額","淡江","科大","電機","學貸","利息","獎學金","學雜費減免","助學金","不利處境","低收入戶","子女","原住民","免學費","高職","五專","高中","升學","專科","統測","四技二專","實習","校外實習","學生","團體保險","平安保險","課業"],
  "工作與薪資":["打工","寒暑假","最低工資","時薪","未成年","工讀生","勞保","勞退","6%","薪資","加班費","工時","倍率","特休","年資","休假","勞動權益","起薪","半導體","碩士","學歷","門檻","國營","台電","中油","公務員","高普考","國考","證照","技能檢定","技術士","技能","創業","貸款","青創"],
  "被裁與失業":["欠薪","1955","申訴","資遣費","新制","舊制","失業給付","就保","非自願離職","職前訓練","津貼","失業"],
  "租屋":["租屋","押金","房東","租金補貼","補貼","補助"],
  "健保與保險":["健保","保費","補充保費","部分負擔","門診","分級醫療","急診","藥品","住院","免部分負擔","重大傷病","職災","傷病給付","醫療給付","失能","死亡","醫療險","實支實付","日額型","金管會","保險","猶豫期","撤銷","契約","意外險","限額"],
  "存款、詐騙與急救":["存款","存款保險","銀行","信用卡","循環利息","利率","詐騙","165","假投資","急救","CPR","AED","119","購物","退貨","省錢","現金"],
  "高風險職業":["機師","培訓","自費","醫師","律師","軍校","服役","高薪","排行","年薪","風險","時間","原則","重來"],
  "生活習慣":["習慣","小事","工作","訊息","休息","手機","注意力","內容","執行力","情緒"]
};
const chip = t => `<button class="chip" data-t="${t}">${t}</button>`;
$("#chips").innerHTML = HOT.map(chip).join("");
const grouped = new Set(Object.values(GROUPS).flat());
const rest = allTags.filter(t => !grouped.has(t));
$("#more").innerHTML = Object.entries(GROUPS).map(([g, ts]) => {
  const have = ts.filter(t => allTags.includes(t));
  return have.length ? `<h4>${g}</h4><div class="chips">${have.map(chip).join("")}</div>` : "";
}).join("") + (rest.length ? `<h4>其他</h4><div class="chips">${rest.map(chip).join("")}</div>` : "");
$("#moreBtn").addEventListener("click", () => {
  const m = $("#more"); m.hidden = !m.hidden;
  $("#moreBtn").textContent = m.hidden ? "更多關鍵字 ▾" : "收起 ▴";
  $("#moreBtn").setAttribute("aria-expanded", String(!m.hidden));
});
$("#sits").innerHTML = SITS.map(s => `<button class="sit" data-s="${s.id}"><b>${s.t}</b><span>${s.d}</span></button>`).join("");

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function card(e){
  const ev = e.ev.map(x => `<div class="ev"><span class="badge g-${x.g}">${x.g}</span>${
    x.u ? `<a href="${x.u}" target="_blank" rel="noopener">${esc(x.t)}</a>` : esc(x.t)}</div>`).join("");
  return `<article class="entry" id="e${e.id}">
    <h3>${esc(e.title)}</h3>
    <div class="row"><div class="k">花掉什麼</div><div>${esc(e.spend)}</div></div>
    <div class="row"><div class="k">換回什麼</div><div>${esc(e.gain)}</div></div>
    <div class="row"><div class="k">可靠度</div><div>${ev}</div></div>
    ${e.note ? `<div class="row"><div class="k">補充</div><div>${esc(e.note)}</div></div>` : ""}
    ${e.warn ? `<div class="warn">⚠ ${esc(e.warn)}</div>` : ""}
    <div class="tags">${e.tags.map(t=>"#"+t).join(" ")}</div>
  </article>`;
}

function render(list){
  list = list || E.filter(e =>
    (!sit || e.sit.includes(sit)) &&
    (!tag || e.tags.includes(tag)) &&
    (!q || JSON.stringify(e).toLowerCase().includes(q)));
  $("#count").textContent = `顯示 ${list.length} / ${E.length} 條`;
  $("#list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">沒有符合的條目。<br>可能是這個題目我還沒查證收錄，換個關鍵字，或<br><button class="btn" id="clear" style="margin-top:12px">清除篩選，看全部</button></div>`;
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.t === tag));
  document.querySelectorAll(".sit").forEach(b => b.classList.toggle("on", b.dataset.s === sit));
}

/* 一次只用一種篩選（搜尋／標籤／處境），避免條件疊加導致 0 筆 */
function clearAll(){ sit = tag = null; q = ""; $("#q").value = ""; }
$("#q").addEventListener("input", e => { const v = e.target.value.trim().toLowerCase(); sit = tag = null; q = v; render(); });
document.addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return; const t = b.dataset.t; const on = tag === t; clearAll(); tag = on ? null : t; render(); });
$("#sits").addEventListener("click", e => { const b = e.target.closest(".sit"); if(!b) return; const on = sit === b.dataset.s; clearAll(); sit = on ? null : b.dataset.s; render(); });
$("#list").addEventListener("click", e => { if(e.target.id === "clear"){ clearAll(); render(); } });
$("#rand").addEventListener("click", () => { sit = tag = null; q = ""; $("#q").value = ""; render([E[Math.floor(Math.random()*E.length)]]); });
render();
</script>
</body>
